[project]
name = "youtube-content-os"
version = "0.1.0"
description = "Autonomous retention-engineered content OS for 3 Hinglish YouTube channels."
requires-python = ">=3.11"

[project.scripts]
yt-os = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
